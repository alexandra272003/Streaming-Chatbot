<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chat console — streaming-chatbot</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --panel-2: #161d26;
    --border: #232b35;
    --text: #d8dee9;
    --muted: #6b7684;
    --user: #3a6ea5;
    --assistant: #1f2937;
    --accent: #e8a13a;
    --accent-dim: #8a6526;
    --error: #d16969;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 {
    font-size: 14px; font-weight: 600; margin: 0; color: var(--accent);
    letter-spacing: 0.02em;
  }
  header h1::before { content: "> "; color: var(--accent-dim); }

  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; }
  input, select, button {
    font-family: var(--mono); font-size: 13px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent-dim); }
  input[type="number"] { width: 70px; }
  button {
    cursor: pointer; color: var(--bg); background: var(--accent);
    border: none; font-weight: 600;
  }
  button:hover { background: #f0ae4f; }
  button:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
  button.secondary {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  }
  button.secondary:hover { border-color: var(--accent-dim); }

  main {
    flex: 1; display: flex; flex-direction: column; max-width: 820px;
    width: 100%; margin: 0 auto; padding: 20px; overflow: hidden;
  }

  #status {
    font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 16px;
  }
  #status.err { color: var(--error); }

  #messages {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding-right: 4px;
  }
  .msg {
    max-width: 78%; padding: 10px 13px; border-radius: 8px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end; background: var(--user); color: #eaf1fb;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start; background: var(--assistant); color: var(--text);
    border-bottom-left-radius: 2px; border: 1px solid var(--border);
  }
  .msg .role {
    display: block; font-size: 10px; text-transform: lowercase;
    color: rgba(255,255,255,0.55); margin-bottom: 3px;
  }
  .cursor {
    display: inline-block; width: 7px; height: 14px; background: var(--accent);
    margin-left: 2px; vertical-align: text-bottom; animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  form#composer {
    display: flex; gap: 8px; margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  #content { flex: 1; padding: 10px 12px; }
  #empty {
    color: var(--muted); text-align: center; margin-top: 40px; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>chat console</h1>

  <div class="field">
    <label>api base</label>
    <input id="apiBase" value="http://127.0.0.1:8000" size="22">
  </div>

  <div class="field">
    <label>mode</label>
    <select id="mode">
      <option value="baseline">non-streaming (Day 21)</option>
      <option value="sse" selected>SSE stream (Day 22)</option>
      <option value="ws">WebSocket (Day 23)</option>
    </select>
  </div>

  <div class="field">
    <label>conversation</label>
    <input id="convId" type="number" placeholder="none">
    <button class="secondary" id="newConvBtn" type="button">new</button>
  </div>
</header>

<main>
  <div id="status">no conversation loaded — click "new" to start one</div>
  <div id="messages"><div id="empty">messages will appear here</div></div>

  <form id="composer">
    <input id="content" placeholder="type a message…" autocomplete="off" disabled>
    <button id="sendBtn" type="submit" disabled>send</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const apiBase = $('apiBase');
const modeSel = $('mode');
const convIdInput = $('convId');
const statusEl = $('status');
const messagesEl = $('messages');
const contentInput = $('content');
const sendBtn = $('sendBtn');

let ws = null;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'err' : '';
}

function clearEmpty() {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
}

function addMessage(role, text) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = document.createElement('span');
  label.className = 'role';
  label.textContent = role;
  div.appendChild(label);
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = text;
  div.appendChild(body);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return body; // returned so streaming callers can keep appending into it
}

function enableComposer(enabled) {
  contentInput.disabled = !enabled;
  sendBtn.disabled = !enabled;
}

async function createConversation() {
  setStatus('creating conversation…');
  try {
    const res = await fetch(`${apiBase.value}/conversations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'Console chat' }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    convIdInput.value = data.id;
    messagesEl.innerHTML = '';
    setStatus(`conversation #${data.id} ready — mode: ${modeSel.value}`);
    enableComposer(true);
    connectIfWs();
  } catch (err) {
    setStatus(`failed to create conversation: ${err.message}`, true);
  }
}

function connectIfWs() {
  if (ws) { ws.close(); ws = null; }
  if (modeSel.value !== 'ws' || !convIdInput.value) return;

  const wsUrl = apiBase.value.replace(/^http/, 'ws') + `/ws/conversations/${convIdInput.value}`;
  ws = new WebSocket(wsUrl);
  let assistantBody = null;

  ws.onopen = () => setStatus(`conversation #${convIdInput.value} — WebSocket connected`);
  ws.onclose = () => setStatus(`conversation #${convIdInput.value} — WebSocket closed`, true);
  ws.onerror = () => setStatus('WebSocket error — is the server running?', true);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'user_message') {
      // already rendered optimistically on send; nothing to do
    } else if (msg.type === 'token') {
      if (!assistantBody) assistantBody = addMessage('assistant', '');
      assistantBody.textContent += msg.delta;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (msg.type === 'done') {
      assistantBody = null;
      enableComposer(true);
    } else if (msg.type === 'error') {
      setStatus(msg.message, true);
      enableComposer(true);
    }
  };
}

async function sendBaseline(content) {
  const res = await fetch(`${apiBase.value}/conversations/${convIdInput.value}/messages`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
  addMessage('assistant', data.assistant_message.content);
}

async function sendSSE(content) {
  const res = await fetch(
    `${apiBase.value}/conversations/${convIdInput.value}/messages/stream`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    }
  );
  if (!res.ok || !res.body) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error?.message || `HTTP ${res.status}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let assistantBody = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE frames are separated by a blank line; each frame has
    // "event: <name>" and "data: <json>" lines.
    const frames = buffer.split('\n\n');
    buffer = frames.pop(); // last (possibly incomplete) frame stays buffered

    for (const frame of frames) {
      const eventLine = frame.split('\n').find(l => l.startsWith('event: '));
      const dataLine = frame.split('\n').find(l => l.startsWith('data: '));
      if (!eventLine || !dataLine) continue;
      const eventName = eventLine.slice(7);
      const data = JSON.parse(dataLine.slice(6));

      if (eventName === 'token') {
        if (!assistantBody) assistantBody = addMessage('assistant', '');
        assistantBody.textContent += data.delta;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
  }
}

async function handleSend(e) {
  e.preventDefault();
  const content = contentInput.value.trim();
  if (!content || !convIdInput.value) return;

  addMessage('user', content);
  contentInput.value = '';
  enableComposer(false);
  setStatus('waiting for reply…');

  try {
    if (modeSel.value === 'baseline') {
      await sendBaseline(content);
      enableComposer(true);
    } else if (modeSel.value === 'sse') {
      await sendSSE(content);
      enableComposer(true);
    } else if (modeSel.value === 'ws') {
      if (!ws || ws.readyState !== WebSocket.OPEN) connectIfWs();
      ws.send(JSON.stringify({ content }));
      // composer re-enabled by the 'done' event from the server
    }
    setStatus(`conversation #${convIdInput.value} — mode: ${modeSel.value}`);
  } catch (err) {
    setStatus(err.message, true);
    enableComposer(true);
  }
}

document.getElementById('composer').addEventListener('submit', handleSend);
document.getElementById('newConvBtn').addEventListener('click', createConversation);
modeSel.addEventListener('change', () => {
  if (modeSel.value === 'ws') connectIfWs();
  else if (ws) { ws.close(); ws = null; }
});
</script>
</body>
</html>
